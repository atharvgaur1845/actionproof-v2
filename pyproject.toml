[project]
name = "actionproof"
version = "0.2.0"
description = "ActionProof: reward-information observability in tool-using RL, and verifiable execution infrastructure for agentic workflows"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6"]
integrity = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# GPU stack is installed on sharanga only (pinned AgentTune/AuditKIT SHAs), see README.

[project.scripts]
actionproof = "actionproof.integrity.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["actionproof*"]

[tool.setuptools.package-data]
"actionproof.integrity" = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# hash-frozen by A11 (results/a11_hashes.json); not edited after registration
"actionproof/integrity/adapters/ecom.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["actionproof/integrity/adapters/ecom\\.py"]
