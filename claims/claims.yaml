# Claim-to-evidence ledger (Stage 2).
# Every number published in the video, slides, README, site or write-up must resolve to an entry here.
# scripts/s2_numcheck.py reads this file: it re-reads every number from its file, and it fails if a published
# document contains a result number that no entry lists under `shown`. A claim with status "pending" may not be
# stated as a result.
# Fields: id, statement, status (pending | supported | not_supported | not_run), prereg, runs, eval, metric_code,
# stats, verifier, figures, numbers, commit.
# numbers: name -> {value, file, key, agg?, shown}. `key` is a path into the JSON file: strings and integers index
# dicts and lists, a mapping selects the list element whose fields match it. `agg` (mean | sum) reduces a list.
# For a .md file, `key` is a regex whose first group is the number. A list of files averages the same key.
# `value` is compared after rounding the file value to the decimals written in `value`. `shown` lists the exact
# strings that may appear in published documents for this number.

documents:   # scanned by s2_numcheck.py
  - docs/stage2/VIDEO_SCRIPT.md
  - docs/stage2/PRODUCT.md
  - README.md
  - paper/main.tex
  - paper/appendix.tex

claims:
  - id: C1
    statement: >-
      On writes whose first acknowledgement is success but which did not commit, a verdict-grounded
      reward selects authoritative read-back and an acknowledgement-grounded reward of identical
      form does not, with the same sign in every paired seed.
    status: not_supported   # registered composite: H2 holds in every seed, H3 fails (see C1-H2 and C1-H3)
    prereg: PREREGISTRATION_A12.md
    runs: []
    eval: []
    metric_code: [actionproof/integrity/sim/truth.py, actionproof/rewards/proc_rewards.py]
    stats: scripts/s2_stats.py
    verifier: scripts/reference_verifier_proc.py
    figures: []
    numbers: {}
    deviations:
      - "D-A12-1: the registered stop rule fired for R_A seed 0 (zero-variance share 0.864 > 0.80 over steps 40-50); the run continued to step 200. Must be stated wherever a seed-0 C1 result is shown. results/s2/stop_rule_seed0.json"
    commit: null

