name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Clean install
        run: uv venv --python 3.12 && uv pip install ".[integrity,dev]"
      - name: Lint (gateway, simulator, Stage 2 analysis)
        run: .venv/bin/ruff check actionproof/integrity scripts/s2_stats.py scripts/a11_estimands.py scripts/eval_proc_gateway.py scripts/ci_freeze_check.py
      - name: Type check (gateway)
        run: .venv/bin/mypy actionproof/integrity
      - name: Frozen-file guard
        run: .venv/bin/python scripts/ci_freeze_check.py
      - name: Tests (CPU)
        run: .venv/bin/python -m pytest -q
      - name: CLI smoke run
        run: |
          .venv/bin/actionproof compare --task proc_dev-0001 --agent naive --fault pay_supplier:0=phantom
          .venv/bin/actionproof contract show --task proc_dev-0001 > /dev/null
